# Put inside the server { } block of the cv_me nginx site, next to location /graphql.
# Profile photos are served by Django (backend/backend/urls.py -> public_profile_photo).
location /media/profile-photos/ {
    proxy_pass http://127.0.0.1:8000;   # same address used by location /graphql
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
